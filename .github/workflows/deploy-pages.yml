name: Publish Cubey & Canon to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out website
        uses: actions/checkout@v4

      - name: Prepare static game
        run: |
          test -f index.html || (echo "Game files not uploaded yet" && exit 1)
          test -d assets || (echo "Compiled JS and CSS are missing" && exit 1)
          mkdir -p _site
          cp index.html _site/
          for folder in assets audio materials textures; do
            if [ -d "$folder" ]; then cp -R "$folder" _site/; fi
          done
          touch _site/.nojekyll

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
